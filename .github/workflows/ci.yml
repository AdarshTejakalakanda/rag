name: CI / Test Suite

on:
  push:
    branches: [ main, master, "feat/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest & Benchmarks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache Hugging Face & SentenceTransformers Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/sentence_transformers
          key: ml-models-${{ runner.os }}-${{ hashFiles('configs/config.yaml') }}
          restore-keys: |
            ml-models-${{ runner.os }}-

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Install Coverage Agent in Editable Mode
        run: |
          pip install -e .

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Run Retrieval Benchmark Smoke Check
        run: |
          python eval/retrieval/evaluate_retrieval.py --top-k 5

      - name: Upload Test Coverage Artifacts (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
