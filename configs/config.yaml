# Local RAG Test Coverage Analyzer Configuration

repositories:
  - id: repo_1
    name: Reach & QOM Automation Suite
    path: sample_data/feature_repos

paths:
  business_docs_dir: sample_data/business_docs
  reports_dir: reports
  milvus_db_path: data/milvus_rag.db
  cache_dir: .cache

models:
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_dimension: 384
  embedding_device: cpu
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  reranker_device: cpu

retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  rrf_k: 60
  rrf_top_k: 20
  reranker_top_k: 10

bm25:
  k1: 1.5
  b: 0.75

judge:
  provider: gemini
  temperature: 0.1
  max_retries: 3
  gemini:
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
  ollama:
    base_url: http://localhost:11434
    model: llama3.2

milvus:
  mode: lite
  host: 127.0.0.1
  port: 19530
  collection_name: gherkin_scenarios

watcher:
  debounce_seconds: 1.5
  file_patterns:
    - "*.feature"
